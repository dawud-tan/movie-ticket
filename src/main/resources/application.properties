quarkus.application.name=booking-platform

# --- Datasource -------------------------------------------------------------
# Exactly one Agroal-pooled PostgreSQL datasource, used both for Flyway migrations and
# application runtime queries. Row-level security is enabled and FORCEd in the schema itself;
# the non-owning runtime role is the Flyway block below.
quarkus.datasource.db-kind=postgresql

# dev/test: no jdbc.url configured below, so Quarkus Dev Services (Testcontainers)
# starts a real, ephemeral PostgreSQL 18.6 container automatically and Flyway
# migrates it before the app/tests run against it.
%dev.quarkus.datasource.devservices.image-name=postgres:18.6
%test.quarkus.datasource.devservices.image-name=postgres:18.6
# Ephemeral is load-bearing: the suite asserts row counts and expects a fresh database.
# A machine whose ~/.testcontainers.properties has testcontainers.reuse.enable=true, under
# Quarkus 4.0.0.Beta1, kept the test container running after one ./mvnw test and handed
# it, rows and all, to the next run (2026-10-09: 5 failures + 1 error).
%test.quarkus.datasource.devservices.reuse=false
# The @QuarkusIntegrationTest ITs (-Dnative) run the binary in the prod profile. Dev Services
# hands it the container's JDBC URL, but the %prod username/password below still win, so the
# container must accept them: without these two lines both ITs died at boot with "password
# authentication failed for user booking" (2026-10-09).
%test.quarkus.datasource.devservices.username=booking
%test.quarkus.datasource.devservices.password=change-me

# prod (a container on a managed platform): a managed PostgreSQL such as Cloud SQL, over plain
# TCP.
#
# TCP IS THE DEFAULT BY MEASUREMENT, NOT BY PREFERENCE. Google's own connector
# (com.google.cloud.sql:postgres-socket-factory) is the nicer mechanism on a JVM — ADC instead of a
# password, a mutually-authenticated tunnel, Public IP switched off — and it is in this repo, in the
# `cloudsql-connector` Maven profile, one flag away. It is not the default because it does not build
# into a native image out of the box: it drags in dnsjava, the jnr/jffi JNI stack and the whole
# gRPC/gax/xds tree, the last being exactly what pom.xml already excludes from firebase-admin for
# this reason. pom.xml's profile records all four failures in order. Turn it on with
# `-Dcloudsql.connector` and set CLOUD_SQL_INSTANCE, and expect to finish that work first if you are
# still shipping native.
#
# So the database is reached the ordinary way and the security comes from the
# network rather than from the driver:
#
#   PRIVATE IP + DIRECT VPC EGRESS is the intended deployment. The instance keeps Public IP off,
#   the revision gets `--network`/`--subnet` with `--vpc-egress=private-ranges-only`, and nothing
#   is exposed to the internet. sslmode=require on top of that is belt and braces, and cheap.
#
#     DATABASE_URL=jdbc:postgresql://<private-ip>:5432/booking?sslmode=require
#
#   Public IP works too and is the wrong shape: it needs the instance's authorised-networks list
#   to name egress addresses a Cloud Run revision does not have stably, which is what pushes
#   people to 0.0.0.0/0. Do not do that. If Private IP is genuinely unavailable, enable the
#   connector profile rather than opening the instance.
#
# sslmode=require, NOT verify-full, and that is a deliberate stop rather than an oversight:
# verify-full needs the server certificate's CA in a trust store the image would have to carry,
# and Cloud SQL's per-instance CA is downloaded per instance. `require` encrypts without
# authenticating the server, which on a private VPC subnet is the honest trade. If this ever
# leaves a private network, verify-full plus the instance CA is the next step, not more sslmode.
#
# PgJDBC only accepts jdbc:postgresql://host[:port]/db — never a bare
# postgresql://user:pass@host libpq-style URI, which is the form the Cloud SQL console's
# "connection string" field hands you — so DATABASE_URL must already be in that form.
#
# The default below points at nothing usable on purpose: `localhost` is what a developer running
# the packaged jar against docker-compose gets (README), and a deployment that forgets
# DATABASE_URL fails to connect loudly at boot rather than silently reading a wrong database.
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:booking}?sslmode=${DATABASE_SSLMODE:disable}}
%prod.quarkus.datasource.username=${DATABASE_USER:booking}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:change-me}

# With `-Dcloudsql.connector` built in, this is the URL form instead — the connector IGNORES the
# host and port and dials `cloudSqlInstance`, so "localhost" is a placeholder pgJDBC needs
# syntactically, and sslmode must be ABSENT because the connector's tunnel is already the TLS:
#   DATABASE_URL=jdbc:postgresql://localhost/booking?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=<project>:<region>:<instance>
# Keeping it as one whole DATABASE_URL rather than as separate socketFactory/cloudSqlInstance
# properties is what makes the two forms swappable: held separately they would survive an
# override and quietly keep routing through the connector while the URL claimed otherwise.
# (Case matters too — Quarkus upper-cases env-var keys and pgJDBC reads camelCase, so they could
# not come from the environment anyway.)

# Keep each instance's pool small — Cloud-Run-times-pool-size is the
# actual Cloud SQL connection-exhaustion failure mode, not raw capacity.
#
# Ceilings, not tuning — and deleting them is NOT a no-op, which is the trap: Agroal
# defaults to max-size 20 and min-size 0, so removing these two lines doubles the pool and
# gives up the warm connections that keep a first request off a cold handshake. Measured
# 2026-08-16: at ~300 req/s the service had about 1.2 requests in flight, so a pool of 10 was
# never once the constraint. That is a reason to
# leave these alone, not a reason to raise them — the numbers below look tuned, but what
# they are is deliberate bounds on a shared machine.
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# --- Flyway -------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.locations=classpath:db/migration

# The RLS hardening, second half: the runtime pool above may connect as app_runtime —
# NOSUPERUSER, NOBYPASSRLS, and with no UPDATE/DELETE/TRUNCATE on audit_log — while
# migrations keep the owner's credentials, since app_runtime can create nothing.
#
# Both must be set for this to take effect: Quarkus only builds Flyway its own datasource
# when username AND password are present (with no jdbc-url it reuses the datasource's own
# URL, so the socket parameters are not repeated here and cannot drift from it). Default
# them to the datasource's own credentials so a deployment that has not made the switch
# behaves exactly as before — one role for both.
#
# Deploying the switch is not just these two variables: app_runtime has to exist, hold the
# grants, and have LOGIN plus a pg_hba line, and it matters that the grants are issued by the
# OWNER — V1's role block skips them wherever the migrating role lacked CREATEROLE, which is
# every plain owner.
%prod.quarkus.flyway.username=${DATABASE_MIGRATION_USER:${DATABASE_USER:booking}}
%prod.quarkus.flyway.password=${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD:change-me}}

# --- HTTP / reverse proxy (Cloud Run) ---------------------------------------
# Cloud Run injects PORT and requires the container to listen on it, in cleartext, on 0.0.0.0 — the
# Google Front End is what terminates TLS, and a container that opens its own TLS port or ignores
# PORT fails the startup health check. Today Cloud Run's default happens to be 8080, the same as
# Quarkus's, but relying on that coincidence breaks the day it is configured otherwise.
#
# There is deliberately NO ssl-port or certificate config. The container never sees TLS, never sees
# port 80 or 443 (the GFE maps those to PORT), and must not try to redirect between schemes itself
# — that is the front end's job.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Trust X-Forwarded-* so the app's own notion of scheme, host and client IP matches what the client
# actually used, rather than the cleartext hop from the GFE. Without it every absolute URL the app
# generates — OIDC redirect_uri first among them — is built from http://<container>:8080.
#
# Trusting these headers is only safe behind a proxy that controls them, which Cloud Run is: the
# container is not directly reachable, and the GFE sets X-Forwarded-Proto and the Host itself. It
# would NOT be safe on a server whose port is open to the internet: turn it off on a server that
# terminates TLS itself.
#
# ONE HEADER IS NOT IN THAT GUARANTEE, and it is the one that reads as an address:
# X-Forwarded-For is APPENDED to, not replaced. A caller that sends `X-Forwarded-For: 10.1.2.3`
# gets `10.1.2.3, <their real ip>` delivered here, and Quarkus's forwarded parsing takes the FIRST
# entry — so the client IP this setting produces is caller-influenced. It is fine for what it is
# used for (logging, and building absolute URLs, which read the scheme and host rather than the
# address). It is NOT fine as an input to an allow-list: anything that ever wants to make a
# decision from the client address must read request().connection().remoteAddress() instead.
quarkus.http.proxy.proxy-address-forwarding=true

# --- Qute / HTMX ----------------------------------------------------------
# Just "html": a suffix that resolves nothing is a build-time scan for no reason.
quarkus.qute.suffixes=html

# --- Language ---------------------------------------------------------------
# The language an unprefixed URL answers in, and the one whose copy lives in the @Message
# annotations on com.protek.booking.i18n.Msg rather than in a messages/ file. Kept equal to
# Language.DEFAULT.
#
# LOAD-BEARING, not decoration. Unset, Qute's EngineProducer falls back to Locale.getDefault(),
# which is the host's LANG: the same build would then render the header in Indonesian on a
# developer machine set to id_ID and in English in the container, with nothing in the tree
# saying so. That is precisely the failure TemplateExtensions pinned its DateTimeFormatter
# locale to avoid, one layer up.
quarkus.default-locale=en
# A build-time property that only decides which locales a NATIVE image carries; a JVM carries every
# locale. Without it GraalVM keeps only the build machine's locale — so the Indonesian pages would
# still read their copy from msg_id.properties (the bundle is resolved by Quarkus, not by JDK locale
# data) while TemplateExtensions' dates, which follow the reader's locale, quietly came out as "Tue"
# where the reader expects "Sel", on the very same page. Nothing in `./mvnw test` can see that: the
# suite runs on a JVM that carries every locale.
quarkus.locales=en,id

# --- Scheduler (hold-expiry sweep) -----------------------------------
booking.hold-expiry-sweep.interval=30s

# --- Audit-chain anchor (AuditAnchorService, V1's audit_anchor) -------------
# An RFC 3161 authority signs each tenant's chain head hourly. Prod only, so tests and dev mode
# send nothing out. DigiCert's free service: its replies carry the chain to DigiCert Trusted Root
# G4, which `openssl ts -verify` finds in the system CA bundle (checked 2026-11-06,
# over plain HTTP, which RFC 3161 allows because the reply is signed). An Indonesian PSrE's
# authority would weigh more under PP 71/2019 and is one property away, once one is contracted.
booking.audit-anchor.interval=1h
%prod.booking.audit-anchor.tsa-url=http://timestamp.digicert.com

# --- Booking policy ---------------------------------------------------------
# Briefly raised to 25 on 2026-08-15, in the belief that BI-SNAP enforced a ~17-minute minimum QR
# validity. That measurement was the server's unsynchronised clock, not an API rule:
# we send `now + V` by our clock and Midtrans judges it by theirs, so a slow clock
# inflates the apparent floor by exactly the skew. Re-measured after enabling chronyd, a
# 56-second validity is accepted — Midtrans's documented 20-second minimum is the real
# constraint, and it imposes nothing on the hold duration.
#
# So: do NOT raise this "because BI-SNAP needs a longer QR". It does not. Every minute here is a
# minute the seats are out of sale.
booking.hold-duration-minutes=10

# The per-showtime purchase cap: the most seats one self-service hold may ask for. 8 is a
# common published policy. Set to 0 to turn the cap off entirely — the seat map then shows no
# limit hint rather than advertising "up to 0 seats".
#
# Applies to the customer seat map only. Counter sales pass PurchaseCap.Limits.NONE, because the
# counter is the dominant channel and a party of twelve at the desk is a sale, not scalping.
booking.max-seats-per-hold=8

# The other cap: the most seats one customer may hold for one day's showings, across every
# showing that day. 10 is a common published policy. 0 turns it off, exactly as above.
#
# NOT a wider version of the property above. That one compares a list length and touches no
# database; this one is a per-customer count, so it runs inside the hold transaction, and the
# "day" it counts over is a local date in the BRANCH's timezone (site.timezone — see
# CalendarPricing.zoneFor). A UTC day would sell a 00:30 Jakarta showing against the previous
# one, which is calendar pricing's trap in the same direction.
#
# Counted on the showing's start, not on when the booking was made: the policy is about how many
# seats one person can have for one day's screenings, not how many they may buy in an afternoon.
#
# Exempt at the counter for a stronger reason than the per-hold cap is: every walk-in in the
# building shares the one placeholder customer row, so a per-customer daily count applied there
# would refuse the eleventh walk-in ticket of the day because ten other people had bought one.
booking.max-seats-per-day=10

# --- Payment: QRIS Dynamic MPM via Midtrans Core API -----------
# Unset by default, same sentinel pattern as VAPID and OIDC, so the app still boots with zero
# environment variables. With no server key configured, PaymentService.createQrisCharge returns
# empty and the booking falls back to the pay-at-counter flow rather than failing — a missing
# payment integration must not cost a tenant a sale.
midtrans.base-url=${MIDTRANS_BASE_URL:https://api.sandbox.midtrans.com}
midtrans.server-key=${MIDTRANS_SERVER_KEY:__unset__}
midtrans.merchant-id=${MIDTRANS_MERCHANT_ID:__unset__}
# Midtrans requires an acquirer named on a QRIS charge. The resulting QR is interoperable
# across every QRIS-participating wallet and bank app regardless, so this is routing, not a
# restriction on who can pay.
midtrans.qris.acquirer=gopay
midtrans.http-timeout-seconds=15
# Shaved off the hold duration when setting the QR's expiry, so the QR always expires strictly
# BEFORE the hold it belongs to. Without the margin they expire together and a payment landing
# in the overlap settles a seat the expiry sweep may already have released.
midtrans.expiry-safety-margin-minutes=1
# Reconciliation for notifications that never arrived. Every 5 minutes: a lost webhook means a
# customer has paid while their seats are still merely held, so the window before that is
# noticed should be minutes, not hours. Batch-capped per tenant per run.
midtrans.reconciliation.cron=0 */5 * * * ?
midtrans.reconciliation.batch-size=25
# How far past expires_at a non-terminal answer from Midtrans is read as "cannot settle".
# See PaymentReconciliationService#hasLapsed — the margin covers clock skew between their
# validity window and ours, nothing more.
midtrans.reconciliation.give-up-grace=PT1H
# An automatic refund Midtrans did not answer is resent by the same sweep, under the same
# partnerRefundNo, at most this many times (an hour at every 5 minutes); then staff get it on
# /admin/payments. A refusal is never resent.
booking.refund.max-attempts=12

# --- The buyer's email --------------------------------------------------
# Showing cancelled, refund sent, refund refused: plain text to the order's customer, Indonesian
# then English (BuyerMail). OFF UNTIL CONFIGURED: with SMTP_HOST or MAIL_FROM unset nothing is sent
# and every booking works as before. Set SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD and MAIL_FROM in the environment to turn it on.
# 587 with STARTTLS is the default; for 465 set SMTP_PORT=465, SMTP_TLS=true, SMTP_START_TLS=DISABLED.
# Dev and test send to Quarkus's mock mailbox (quarkus.mailer.mock defaults to true there).
quarkus.mailer.host=${SMTP_HOST:__unset__}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USERNAME:__unset__}
quarkus.mailer.password=${SMTP_PASSWORD:__unset__}
quarkus.mailer.from=${MAIL_FROM:__unset__}
quarkus.mailer.tls=${SMTP_TLS:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
# SMTP_PASSWORD is a password, never an OAuth token. Unpinned, Vert.x tries XOAUTH2 first whenever
# the server offers it: against Gmail the server answered 535 to the password sent as a bearer
# token and closed the connection, so LOGIN was never tried and the mail timed out after 60 s. The
# same password logs in over AUTH LOGIN.
quarkus.mailer.auth-methods=PLAIN LOGIN
%dev,test.quarkus.mailer.from=tiket@localhost.invalid

# --- BI-SNAP --------------------------------------------------
# The credential set from Bank Indonesia's SNAP standard, which will eventually replace the
# legacy keys above. Separate from them on purpose: the two APIs coexist through the cutover
# drain, and a transaction created on one cannot be processed by the other.
#
# All six are unset until the credential exchange with Midtrans completes.
# SnapCredentials treats all-six-unset as "BI-SNAP off" and any partial subset as a startup
# failure — a half-configured payment credential is never intentional, and a half-configured
# Web Push credential once took push down silently, which is what that rule is guarding against.
#
# The keys are PATHS, not values: a PEM in an environment variable is visible to anything that
# can read the revision's configuration or /proc/<pid>/environ. Absolute paths only. On Cloud
# Run the path is a Secret Manager mount (--set-secrets=/secrets/<name>=<secret>:latest), never
# a file baked into the image — see the Cloud Run block near the end of this file.
# Which Midtrans API creates charges: "snap" (BI-SNAP) or "legacy" (Core API v2).
# BUILD-TIME: it decides which gateway bean exists, so switching needs a rebuild
# (./mvnw package -Dmidtrans.api=legacy to go back). That is deliberate — the cutover requires a
# deploy anyway, and it means the payment path cannot be repointed by editing an env file on a
# live server.
#
# Default flipped to snap on 2026-08-17, because every build that was meant to be on BI-SNAP had
# to remember -Dmidtrans.api=snap, and forgetting it produced a perfectly successful build that
# quietly kept charging through the legacy Core API. Nothing else distinguishes the two at boot —
# the service starts, the seat map works, a booking completes — so the default now matches the
# intent and PaymentGatewayStartupLog still says at INFO which one is actually in charge.
#
# Legacy remains reachable with -Dmidtrans.api=legacy and is the rollback path; it is still
# @DefaultBean, so it wins whenever the SNAP bean is not produced.
#
# A transaction created on one API cannot be processed by the other, so the flip belongs on a
# window with zero pending QRIS payments.
midtrans.api=snap

# Tests stay on the legacy gateway, and this line is load-bearing rather than tidy-up.
# StubMidtransGateway and TestSignatureVerifier extend HttpMidtransGateway and the real verifier
# because QuarkusMock.installMockForType resolves by BEAN CLASS — so when the SNAP
# bean is the active MidtransGateway, installing those stubs fails outright with "not assignable",
# taking 38 payment, refund, cancellation and fragment tests with it. Flipping the default above
# to snap without this line is exactly that mistake, and it is invisible until the suite runs.
#
# This is not a new coverage gap: the payment suite has always exercised the legacy path, and with
# the SNAP bean not produced the existing tests run untouched.
# GatewaySelectionTest and LegacyGatewaySelectionTest pin the two selections explicitly, and
# ShippedGatewayDefaultTest pins that the value above is still `snap` for production.
%test.midtrans.api=legacy

# Sandbox host. BI-SNAP lives on a different domain from the legacy API (api.sandbox.midtrans.com
# above) — merchants.sbx.midtrans.com for sandbox, merchants.midtrans.com for production.
midtrans.snap.base-url=${MIDTRANS_SNAP_BASE_URL:https://merchants.sbx.midtrans.com}
midtrans.snap.http-timeout-seconds=15
midtrans.snap.client-id=${MIDTRANS_SNAP_CLIENT_ID:__unset__}
midtrans.snap.client-secret=${MIDTRANS_SNAP_CLIENT_SECRET:__unset__}
# X-PARTNER-ID, mandatory on every transactional call (though NOT on the access-token call).
# For a single-merchant account this is the MERCHANT ID — settled by measurement 2026-08-15, not
# from the docs, which deadlock on it. A Partner *account* manages several merchants and this one
# has none; a Partner *ID* names whoever calls the API, and a single merchant is still the caller.
# A probe returned 2004700 with the merchant id in this header.
midtrans.snap.partner-id=${MIDTRANS_SNAP_PARTNER_ID:__unset__}
# CHANNEL-ID — no X- prefix on this header, unlike every other one. Also issued at exchange time.
midtrans.snap.channel-id=${MIDTRANS_SNAP_CHANNEL_ID:__unset__}
# Ours, PKCS8 — signs the access-token request.
midtrans.snap.private-key-path=${MIDTRANS_SNAP_PRIVATE_KEY_PATH:__unset__}
# Midtrans's — verifies inbound notification signatures. Not the public half of the key above.
midtrans.snap.midtrans-public-key-path=${MIDTRANS_SNAP_MIDTRANS_PUBLIC_KEY_PATH:__unset__}

# --- Billing ----------------------------------------------------------
# Daily, not monthly: a once-a-month job that fails — or falls on a day the service is
# scaled to zero — silently skips an entire billing cycle. Daily runs plus the
# ON CONFLICT DO NOTHING upsert make generation self-healing instead.
billing.generation.cron=0 15 3 * * ?
billing.grace-period-days=14
# Flat monthly tier prices. Tier NAMES are placeholders; the numbers are config precisely
# because pricing is what a first tenant conversation informs.
billing.tier.starter.monthly-idr=500000
billing.tier.business.monthly-idr=2000000
billing.tier.enterprise.monthly-idr=7500000

# --- Tenant resolution -------------------------------------------------------
# The tenant comes from the authenticated identity, never from caller-supplied input — see
# CurrentTenant, which offers no API that accepts a tenant id or a hostname. This slug is the
# fallback for requests with no identity to derive from: the public browse and seat-map pages, plus
# the dedicated-compute tier where one Cloud Run service serves exactly one tenant and the
# deployment's own config is the right authority.
booking.tenant.slug=demo-cinema

# --- Authentication ---------------------------------------------------
# Google SSO via OIDC. Disabled by default so the app keeps its verified property of
# booting with zero environment variables set — with tenant-enabled=false there is no
# discovery call at startup and no required client credentials, and @RolesAllowed still
# rejects anonymous callers (401), so the authorization boundary is intact even here.
# Set OIDC_ENABLED=true plus the client id/secret to turn real login on.
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://accounts.google.com}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:__unset__}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:__unset__}
# web-app, not service: this is a server-rendered Qute/HTMX app, so the browser needs the
# authorization-code redirect flow, not bearer-token validation.
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=email,profile
# Ask Google for the email claim in the ID token — the augmentor maps identity to role via
# app_user.email on first login, and has nothing to match on without it.

# Cloud Run terminates TLS at the Google Front End and forwards cleartext to the container, so
# without this the app sees scheme=http on its own port and would send Google an http redirect_uri,
# which it rejects for everything except localhost. proxy-address-forwarding below is what makes the
# scheme and host correct in general; this is the narrower guarantee for the redirect_uri
# specifically, and is kept as insurance in case forwarding is ever turned off.
quarkus.oidc.authentication.force-redirect-https-scheme=true

# One fixed redirect_uri, because Google matches it EXACTLY against a pre-registered list. Left
# unset, Quarkus sends whatever page the user was on, so signing in from the seat map and from
# /admin would produce two different URIs and each would have to be registered by hand — anything
# missed fails with redirect_uri_mismatch. Register exactly one:
#   https://<service>-<hash>-<region>.a.run.app/callback   (or the mapped custom domain)
quarkus.oidc.authentication.redirect-path=/callback
# ...and send the user back to the page they started on, rather than leaving them at /callback.
quarkus.oidc.authentication.restore-path-after-redirect=true

# A signed-out htmx request gets 499 instead of a 302 to Google. htmx follows a redirect itself,
# the cross-origin hop fails, and the seat map saw status 0 ("could not reach the server") where it
# should say the session expired and offer sign-in. Only effective with HtmxRequestChecker, which
# is what makes Quarkus count an HX-Request as JavaScript; a page navigation still gets the 302.
quarkus.oidc.authentication.java-script-auto-redirect=false

# NOTE: deliberately no quarkus.oidc.logout.path. It enables RP-Initiated Logout, and Quarkus
# refuses to START when the provider advertises no end_session_endpoint — which Google does not, so
# setting it takes the whole service down at boot rather than failing when someone signs out.
# Verified by starting with OIDC_ENABLED=true: the process died before printing a banner. See
# LogoutResource, which clears this app's session locally and leaves the user's Google session alone
# (ending that too would sign them out of Gmail for buying a cinema ticket).

# A Google account with no app_user row is enrolled as a customer of the configured tenant
# (see AppUserAugmentor). Staff/admin roles are never auto-granted.
booking.auth.auto-provision-customers=true

# --- Native customer clients: bearer Google ID tokens on /api/app/* -----------
# A second OIDC tenant, for a native ticket-buyer client: it signs in with Google and sends the ID
# token it gets back as `Authorization: Bearer`, and tenant-paths routes /api/app/* here while every
# other path keeps the browser's code flow above. Android's Credential Manager signs the customer in
# with the WEB client id passed as the server client id, and Google then puts that id in the ID
# token's `aud` — so the audience here is OIDC_CLIENT_ID, the web tenant's own, not a client of the
# app's. Pinning it is the security half: without it, a token Google minted for some other site's
# sign-in names the right person and would be accepted; pinned, it fails here.
#
# AppUserAugmentor maps the token as it maps a browser sign-in, so the client's customer is the
# web's customer: the same app_user row (by `sub`, then email) and the same `customer` row behind
# it, checked on every call, so deactivating an app_user row locks the client out on its next
# request.
#
# Off by default, like the web tenant, so a fresh checkout boots with zero environment variables.
# A disabled tenant does NOT hand the path back to the web tenant's session cookie: tenant-paths
# routes /api/app/* here either way, and a disabled tenant signs nobody in, so the cookie gets a
# 401 (SessionCookieOffApiTest, against the fake provider). That, not @Consumes(JSON), is what
# keeps a cross-site POST out: a POST with no Content-Type skips @Consumes. Keep the tenant-paths
# line even while the tenant is off. Browse stays anonymous with it on: a request with no
# Authorization header reaches /api/app's unannotated methods as anonymous (AppApiSignedInTest),
# while a bad or expired token is a 401 even there, which is the client's cue to sign in again.
quarkus.oidc.customer-app.tenant-enabled=${CUSTOMER_APP_OIDC_ENABLED:false}
quarkus.oidc.customer-app.auth-server-url=${OIDC_AUTH_SERVER_URL:https://accounts.google.com}
quarkus.oidc.customer-app.client-id=${OIDC_CLIENT_ID:__unset__}
quarkus.oidc.customer-app.application-type=service
quarkus.oidc.customer-app.token.audience=${OIDC_CLIENT_ID:__unset__}
quarkus.oidc.customer-app.tenant-paths=/api/app/*

# Absolute origin for the "Sign in" link (see SignInLink). NOT needed on Cloud Run, where there is
# exactly one origin and the Google Front End already redirects http to https — the empty default
# leaves a relative /login, which is correct there. It exists for a server that terminates TLS
# itself and serves plain HTTP and HTTPS on two different ports at once, where
# force-redirect-https-scheme fixes the scheme but not the port and sign-in has to be pinned to the
# TLS port explicitly.
#
# It has a SECOND reader, added with the SEO work: PublicUrls builds every
# absolute public URL the deployment claims — <link rel="canonical">, og:url, the JSON-LD
# "url" properties, and the <loc> entries in /sitemap-showtimes.xml. That one DOES matter on
# Cloud Run, and it is config rather than the Host header for the same reason tenancy is kept
# off that header: a canonical built from caller-supplied input tells a crawler that
# the real copy of the page lives on whatever hostname the request arrived with.
#
# Unset is a supported state, not a fault: pages then emit no canonical and no og:url, and
# the sitemap answers 503 rather than publishing relative URLs no crawler can use. On Cloud
# Run set it to the mapped custom domain (or the run.app URL) WITHOUT a port:
#   PUBLIC_HTTPS_BASE_URL=https://tiket.example.com
#
# Setting it does NOT put anything in robots.txt — that file is static and cannot read
# configuration, so its `Sitemap:` line hardcodes an origin and has to be edited with it.
booking.public.https-base-url=${PUBLIC_HTTPS_BASE_URL:}


# Google Wallet event tickets. The numeric issuer id from the Google Pay & Wallet
# Console; unset means no "Add to Google Wallet" button anywhere, which is a supported state and
# the current one on every deployment. The pass is ADDITIVE — the Code 128 barcode on the ticket
# page is the ticket, works offline, prints for a walk-in, and is what the door scans either way.
#
# No second credential: the pass is one JWT signed with the service-account key already reaching
# the process through GOOGLE_APPLICATION_CREDENTIALS for Web Push. Nothing is sent to Google from
# the server — the class and object definitions travel inside the link, so a server with no
# outbound internet issues passes exactly as well as one with it.
#
# Optional<String> in GoogleWalletLinks, not String: with the env var unset this property is
# defined-and-empty, which SmallRye converts to null and which fails a plain String injection
# point at deployment time (the trap SignInLink records paying for).
booking.wallet.issuer-id=${WALLET_ISSUER_ID:}

# Optional bootstrap: promotes/creates this email as platform_admin at startup, so the
# first real admin does not have to be seeded into a committed migration. Unset by default.
booking.bootstrap.platform-admin-email=${PLATFORM_ADMIN_EMAIL:__unset__}

# --- Test-only race-window seam — inert (0ms) outside the test
# profile; set explicitly by the concurrency tests that need it. -----------
booking.test.race-delay-ms=0

# --- Web Push (FCM-token-mediated, via Firebase Admin SDK — resource_pool_watch
# verification harness) -----------------------------------------------------
# "__unset__" (not blank) is the default: SmallRye Config's ${VAR:default} expression
# syntax, tested directly against this Quarkus version, throws a ConfigurationException
# at startup for an *empty* default (${VAR:}) when the env var is absent — a real,
# verified quirk, not a guess — so a non-empty sentinel is what actually keeps startup
# working with zero env vars set. PushNotificationService.isConfigured() treats this
# sentinel the same as blank. Reads the real value from the shell's VAPID_PUBLIC_KEY
# when present. Only the public key is needed anywhere in this codebase now — the
# server-side Admin SDK send doesn't touch VAPID at all, only the browser's
# register(messaging, {vapidKey}) call does.
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:__unset__}

# --- Realtime availability push ----------------------------------------------
# Kill switch for the notify-on-commit step, independent of whether Firebase credentials exist:
# an operator may want push off even where it would work (a push storm, a noisy deploy) and
# should not need a code change or credential removal to get there. With this false, or with no
# VAPID key configured, the seat map falls back to its 3s polling refresh — push is a latency
# improvement over polling, not the mechanism that makes the map live.
booking.push.notify-on-commit=true

# Firebase Web App client config — not secret, meant to ship in client-side JS (protected by
# Firebase Security Rules, not obscurity), but it names one Firebase project, so it comes from
# the environment: the Firebase console's web-app config, one variable per field. Exposed to the
# /push/test page and its service worker via PushResource's @ConfigProperty injection + Qute
# template params, rather than hardcoded in the templates or duplicated in a separate config
# mechanism. Unset, push is simply unavailable, like an unset VAPID key.
webpush.firebase.api-key=${FIREBASE_API_KEY:__unset__}
webpush.firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:__unset__}
webpush.firebase.project-id=${FIREBASE_PROJECT_ID:__unset__}
webpush.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:__unset__}
webpush.firebase.messaging-sender-id=${FIREBASE_MESSAGING_SENDER_ID:__unset__}
webpush.firebase.app-id=${FIREBASE_APP_ID:__unset__}

# --- Logging ---------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.protek.booking".level=DEBUG

# --- Native image ------------------------------------------------------------
# firebase-admin resolves its default HTTP transport through a classic
# initialization-on-demand holder: ApiClientUtils.getDefaultTransport() ->
# ApiClientUtils$TransportInstanceHolder, which starts a real Apache HttpClient5
# async thread pool as a side effect of class init. If native-image ever
# initializes that holder at build time, the running thread gets baked into the
# image heap, which native-image hard-rejects ("Detected a started Thread in the
# image heap"). Deferring it to run-time initialization is the standard fix for
# this class of issue in Google API-client-based SDKs.
#
# This is the only native-image-specific flag PushNotificationService's Admin-SDK
# send path needs — it was previously a much longer list (BouncyCastle/jose4j/
# nl.martijndwars:web-push-specific --initialize-at-run-time entries) from an
# earlier raw Web Push implementation that hit a genuine, unresolved GraalVM/Mandrel
# javax.crypto.JceSecurity limitation (see git history / PR description for that
# investigation if it's ever relevant again). Switching to FCM-token-mediated
# sending via the Admin SDK removed all of that: no new crypto code, no new
# native-image risk, reusing the exact reflection/init handling already verified
# here for firebase-admin.
#
# The other three entries — org.xbill.DNS, jnr, com.kenai — are for the `cloudsql-connector`
# Maven profile, and are here UNCONDITIONALLY on purpose. All three are PACKAGE-form, which
# GraalVM accepts when nothing on the classpath matches, so with the profile off (the default,
# and the shipped configuration) they cost nothing; with it on they are already correct, which
# is one less thing to remember when enabling it.
#
# What each is for, so nobody deletes them as dead config:
#  * org.xbill.DNS — dnsjava's Header holds a static SecureRandom for query ids, and native-image
#    refuses a seeded Random in the image heap. What makes it reachable is not the connector:
#    Narayana calls InetAddress.getLocalHost() from a class initializer and analysis follows that
#    into dnsjava's resolver. dnsjava cannot simply be excluded — InternalConnectorRegistry
#    references DnsJavaResolver whatever form the instance name takes.
#  * jnr, com.kenai — jnr-unixsocket's JNI stack puts a java.lang.ref.Cleaner, and then a
#    NativeInvocationHandler proxy, in the image heap. That code is only executed for the
#    connector's own unix-socket option, which nothing here sets, so deferring initialization is
#    free: the classes exist and are never initialized.
#
# These are necessary but NOT sufficient for a native build with the profile on — pom.xml's
# profile documents the wall they stop at.
#
# NOTE, because it looks alarming and is not: dnsjava ships
# META-INF/services/java.net.spi.InetAddressResolverProvider, which would replace the JDK's DNS
# resolution for the WHOLE application. It does not, by default —
# DnsjavaInetAddressResolverProvider gates itself on Boolean.getBoolean("org.dnsjava.spi.enable"),
# so the builtin resolver stays in charge unless someone sets that property. Do not set it.
#
#  * io.quarkiverse.langchain4j's three ObjectMapper holders (/chat, 2026-10-31): their static
#    initializers ask Arc for the application's ObjectMapper customizers, and at image build time
#    there is no container, so the build failed with "Class initialization of
#    OpenAiRestApi$ObjectMapperHolder failed" (NullPointerException on Arc.container()) under
#    quarkus-langchain4j 2.0.0.Beta1 on Quarkus 4.0.0.Beta2. Remove them once the extension
#    registers them for run-time initialization itself.
quarkus.native.additional-build-args=--initialize-at-run-time=io.quarkiverse.langchain4j.openai.common.OpenAiRestApi$ObjectMapperHolder,--initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$ObjectMapperHolder,--initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$SnakeCaseObjectMapperHolder,--initialize-at-run-time=com.google.firebase.internal.ApiClientUtils,--initialize-at-run-time=com.google.firebase.internal.ApiClientUtils$TransportInstanceHolder,--initialize-at-run-time=org.xbill.DNS,--initialize-at-run-time=com.kenai,--initialize-at-run-time=jnr

# --- Cloud Run: stateless container, request-scoped CPU ----------------------
# No file logging, no ssl-port, no tcp-cork/tcp-fast-open, no io_uring. Those tune a long-lived
# JVM that owns its machine; this ships into a container that may be created for one request
# and destroyed after it. The HTTP block near the top of this file (PORT, 0.0.0.0,
# proxy-address-forwarding) is the whole HTTP story here.
#
# Logging goes to STDOUT ONLY, which is not a setting but the absence of one: Cloud Logging
# reads the container's stdout, and a rotating file inside a container filesystem that is
# discarded with the instance is write-only in the worst sense. Do NOT add quarkus.log.file.*.
#
# THREE THINGS THAT ARE DEPLOY-TIME FLAGS, NOT PROPERTIES, and each silently disables a
# feature that has no other symptom:
#
#  * --no-cpu-throttling — CPU is allocated only while a request is being processed unless
#    this is set. SeatAvailabilityNotifier hands the push to a ManagedExecutor AFTER the
#    response is written, by design (the notify-after-commit invariant), so without this
#    the task may not run until the next request lands on the same instance, or ever. It
#    fails with no log line and every test still passes.
#  * --min-instances=1 — the scheduled work (hold-expiry sweep every 30s, the Midtrans
#    reconciliation cron, the daily billing roll-up) only runs while an instance exists. A
#    service scaled to zero simply does not expire holds, so seats stay held until somebody
#    happens to browse. This is a DIFFERENT setting from the one above and neither implies
#    the other.
#  * --max-instances — every instance runs those same schedulers. The sweep and the
#    reconciliation pass are safe to run concurrently (they take FOR UPDATE row locks and
#    re-check state inside the transaction), but they are not free, and N instances means N
#    times the polling. Keep --concurrency near jdbc.max-size above so the service scales OUT
#    on connections rather than queueing on them, and keep max-instances small enough that
#    max-instances x max-size stays under the Cloud SQL tier's connection limit — that
#    product, not raw capacity, is the real exhaustion mode.
#
# Secrets are files, and that is Secret Manager's mount, not a baked layer:
#   --set-secrets=/secrets/snap-private.pem=snap-private-key:latest
# then point MIDTRANS_SNAP_PRIVATE_KEY_PATH at /secrets/snap-private.pem. The same applies to
# MIDTRANS_SNAP_MIDTRANS_PUBLIC_KEY_PATH. Leave GOOGLE_APPLICATION_CREDENTIALS unset unless the
# ticket page is to offer Google Wallet: ADC then resolves to the revision's own service account,
# the identity for Firebase and the Cloud SQL connector. Wallet signs its pass with a service
# account's private key (GoogleWalletLinks.credentials accepts nothing else), and the metadata
# server's credentials have none, so with the variable unset the Wallet link stays off and logs
# one warning; the ticket itself is unaffected. To offer Wallet, mount a key file the same way and
# point GOOGLE_APPLICATION_CREDENTIALS at it. ADC reads that variable first, so the key's account
# then becomes the identity for Firebase and the Cloud SQL connector as well.

# --- The browse-to-seat-map flow --------------------------------------------------------------
#
# The city a visitor with no cookie and no shared location gets. Matched loosely by
# CityPreference — a default of "Jakarta" lands on "Jakarta Pusat", which is how Indonesian
# cities are actually named in a branch list, so an exact-match-only default would never fire.
booking.default-city=Jakarta

# How long /booking?booking_ref=... stays openable. Much longer than the hold duration above,
# and they are not comparable: a hold is a claim on a seat somebody else wants, so ten minutes
# is a fairness limit; a draft claims nothing, so this only stops the table growing without
# bound. See BookingDraft.
booking.draft-lifetime=PT12H

# A viability rule some cinemas run: a screening only runs if at least two seats are sold, and one
# that has not sold two by fifteen minutes past its advertised start is cancelled.
#
# Set the minimum to 1 to turn BOTH halves off — one seat is then never below it, and no showing
# can ever be under-sold. That is what every tenant without this rule wants, and it is why the
# rule is configuration rather than code.
booking.minimum-seats-per-showtime=2
booking.showtime-viability-grace=PT15M

# OFF in the test profile, and that is a deliberate trade rather than an oversight. The rule
# refuses a first hold of one seat, and a large part of the existing suite — every concurrency
# test in particular — races several callers for ONE seat, which is the shape that proves the
# EXCLUDE constraint works. Leaving the rule on globally would have meant rewriting those tests
# to be about two seats, which would have quietly changed what they demonstrate.
#
# The rule itself is covered by ShowtimeViabilityTest, which turns it back on through a
# @TestProfile — the same arrangement PoolMetricsTestProfile and SchedulerOffTestProfile use.
%test.booking.minimum-seats-per-showtime=1

# --- The booking assistant (/chat) --------------------------------------------
# quarkus-langchain4j AI service with @Tool, in the JVM, over /api/app's reads. Off while the key
# is __unset__: /chat 404s and the nav hides the link. The key is the deployment's environment
# (on Cloud Run, a Secret Manager secret mounted as BOOKING_ASSISTANT_API_KEY), never here.
#
# For a demo the host is Groq's FREE tier, abroad: the chat text leaves Indonesia and may be logged
# there, which is why /chat tells the reader so above the text input, and why this is not a
# production route. Production needs an in-country host (Bedrock Jakarta or an Indonesian GPU
# host); only base-url, model and booking.assistant.host change. qwen3.8-27b is the model a
# tool-calling benchmark measured best on formal Indonesian on 2026-10-16.
quarkus.langchain4j.openai.base-url=${BOOKING_ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
quarkus.langchain4j.openai.api-key=${BOOKING_ASSISTANT_API_KEY:__unset__}
quarkus.langchain4j.openai.chat-model.model-name=${BOOKING_ASSISTANT_MODEL:qwen/qwen3.8-27b}
quarkus.langchain4j.openai.chat-model.temperature=0
# Wait out the per-minute window rather than fail fast. Until 2026-10-17 this was 1, "a customer is
# waiting: fail fast and say so", and on Groq's free tier (7k input tokens a minute) that meant a
# seat proposal, ~16k tokens over several calls, could never finish: the first two proposals both
# ended in chatUnavailable on an ITPM 429. 10 is the benchmark's setting, under which all 40 of its
# formal-Indonesian tasks finished; langchain4j backs off 0.5 s x 1.5^n, ~57 s per call at most, and
# the page says it is waiting (customer/chat.html). On a paid tier with headroom, 1 is right again.
quarkus.langchain4j.openai.timeout=60s
quarkus.langchain4j.openai.max-retries=10
# Never log prompts or replies: they are what a customer typed.
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
# A conversation keeps its tool calls and results, oldest dropped first, up to a token budget rather
# than a message count. Until 2026-10-23 it was 60 messages, and a long conversation sent one
# request over Groq's free-tier cap of 7,000 input tokens a minute. One benchmark task sent 8,992
# ("Request too large"), which no retry can fix. The budget is counted in o200k
# (AssistantTokenCount), and Groq bills up to 1.33x that. Add the system prompt and tool schemas, at
# most ~1,080 tokens (a first call's whole input), and 4,000 gives at most ~6,400. The largest
# proposal turn the benchmark measured, about 3,500 o200k with one free_seats table of ~2,300, still
# fits whole; that table carried a UUID per seat, and since 2026-10-24 it lists labels
# (AssistantTools.FreeRow). On a paid tier, raise it. 3,500 since 2026-10-27: on UUID-heavy tool
# results Groq billed ~1.45x, not 1.33x (4,296 o200k of tool traffic, 6,871 in the last request at
# 4,000), so 4,000 left 129 tokens under the cap. 3,500 tops out near 6,200.
quarkus.langchain4j.chat-memory.type=token-window
quarkus.langchain4j.chat-memory.token-window.max-tokens=3500
# Said in the page's privacy notice: it must name where the text actually goes.
booking.assistant.host=${BOOKING_ASSISTANT_HOST:Groq, Inc. (United States)}
booking.assistant.daily-messages=${BOOKING_ASSISTANT_DAILY_MESSAGES:30}
# QwenTokenCount reads this with getResourceAsStream; a native image carries only the resources it
# is told to (a JVM build needs no such line).
quarkus.native.resources.includes=qwen3.8-27b.tiktoken.gz
