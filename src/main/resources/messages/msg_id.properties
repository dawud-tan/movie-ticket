# Bahasa Indonesia. The default (English) copy is the @Message text on com.protek.booking.i18n.Msg;
# this file overrides it key by key, and a key here with no method there FAILS THE BUILD.
#
# Encoding: Quarkus reads message files as UTF-8, unlike java.util.ResourceBundle's historical
# Latin-1. The em dashes below are typed as real characters rather than \u escapes, which is the
# rule this file follows: anything that wants a proper quote or an "é" is typed too. An escape
# here would be a second spelling of a character the English side of the same message writes
# directly in Msg.java.
#
# Register, deliberately: the second person is implied rather than written ("Pesan tiket", not
# "Pesan tiket Anda"), which is how the market's own cinema sites read. Where a choice had to be
# made between the loanword and the Indonesian word, the loanword won if that is what a ticket
# buyer says out loud — "film", not "filem".

