# --- admin/staff.html ---
admStaffLevels=Semua yang terdaftar di sini bisa menjual di loket, memindai tiket di pintu masuk, dan membatalkan pemesanan lewat telepon. <strong>Manajer</strong> juga bisa menambah dan menghapus orang di halaman ini.
admStaffHowToAdd=Tambahkan orang lewat alamat Google yang akan dipakainya masuk — orang itu tidak perlu punya akun di sini lebih dulu, dan tidak ada apa pun yang dikirimkan kepadanya: alamatnya dikenali saat pertama kali dia masuk. Menghapus orang berarti menonaktifkannya, bukan menghapusnya, agar catatan apa yang dia kerjakan di kasir tetap bisa ditelusuri.
