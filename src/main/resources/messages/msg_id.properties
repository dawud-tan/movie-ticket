holdDayCapFull=Anda sudah punya {held} untuk jadwal tayang pada {day}, dan batasnya {limit} sehari. Lepaskan salah satunya, atau pilih jadwal tayang di hari lain.
holdDayCapPartial=Anda sudah punya {held} untuk jadwal tayang pada {day}, dan batasnya {limit} sehari. Anda masih bisa menambah {remaining} — batalkan centang {untick} lalu coba lagi.
holdFirstBuyerMinimum=Jadwal tayang ini belum terjual satu kursi pun, dan pemesanan pertama harus minimal {minimum} kursi — bioskop membatalkan pemutaran yang belum terjual {minimum} kursi dalam {grace} menit dari jam mulainya. Anda memilih {requested}.
