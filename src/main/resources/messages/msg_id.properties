admHolidaysWhat=Tanggal-tanggal ini menggerakkan <strong>band harga hari libur</strong> — baik hari itu sendiri maupun <strong>sehari sebelumnya</strong>, cara kebanyakan bioskop di sini memberi harga malam menjelang libur. Tanggal yang tidak ada di daftar ini diberi harga menurut hari dalam minggu.
admHolidaysMoveable=Hanya lima hari libur nasional tetap yang sudah terisi. Idul Fitri, Idul Adha, Nyepi, Waisak, Imlek, Isra Mikraj, Maulid, Wafat, dan Kenaikan Isa Almasih semuanya berpindah tiap tahun, dan <em>cuti bersama</em> juga diputuskan tiap tahun — semuanya berasal dari SKB 3 Menteri, jadi tambahkan di sini setelah keputusannya terbit. Tambahkan hari tutup Anda sendiri dengan cara yang sama.
admAddDate=Tambah tanggal
admTwoHolidaysOneDay=Bila dua hari libur jatuh pada hari yang sama, sebutkan keduanya dalam satu baris — band harganya sama saja, dan satu tanggal adalah satu baris.
admThisYearOnward=Tahun ini dan seterusnya
admNoHolidays=Belum ada tanggal terdaftar. Studio yang memakai harga kalender akan memberi harga setiap hari menurut hari dalam minggu sampai satu tanggal ditambahkan.

# --- admin/paymentsNeedingAttention.html ---
admPaymentsIntro=Hal lain beres sendiri — tagihan yang lunas mengonfirmasi kursinya, yang tidak dibayar kedaluwarsa, dan pemindaian rekonsiliasi mengejar yang notifikasinya hilang. Dua daftar ini yang tidak bisa diselesaikan oleh proses mana pun untuk Anda.
admFraudReview=Tertahan untuk peninjauan fraud
admFraudReviewWhat=Midtrans <strong>sudah mengambil uangnya</strong> dan menunggu keputusan terima-atau-tolak di <strong>dasbor mereka</strong>. Kursinya tetap ditahan, bukan dikonfirmasi, sampai keputusan itu turun — mengonfirmasi kursi atas pembayaran yang masih bisa ditarik kembali adalah hasil yang perlu dihindari.
admFraudReviewAction=Tidak ada di halaman ini yang memutuskannya. Terima atau tolak di Midtrans MAP; platform ini mengambil hasilnya pada pemindaian rekonsiliasi berikutnya lalu mengonfirmasi atau menggagalkan pemesanannya. Bila ada pelanggan menunggu di loket, keputusan di sanalah yang membebaskan mereka.
admWaitingSince=Menunggu sejak
admOrder=Pesanan
admAmount=Jumlah
admBooking=Pemesanan
admViewOrder=Lihat pesanan
admNoFraudReview=Tidak ada yang tertahan untuk peninjauan. Daftar ini biasanya kosong — QRIS tidak punya tahap peninjauan fraud, jadi hanya penagihan bergaya kartu yang bisa sampai ke sini.
admRefundsOwed=Dana yang harus dikembalikan
admRefundsWhat=Pemesanan yang <strong>sudah dibayar</strong> lalu dibatalkan. Jumlah di bawah adalah hak pelanggan untuk dikembalikan, dijumlahkan dari kursi yang benar-benar dibatalkan pada harga jual masing-masing.
admRefundsAction=Utang pada pembayaran QRIS dikirim kembali ke aplikasi pembayaran pembeli secara otomatis, dan keluar dari daftar ini setelah Midtrans mengonfirmasi refundnya. Utang tunai, atau refund otomatis yang ditolak Midtrans (tercantum di bawah Refund di gateway yang perlu diperiksa, beserta langkahnya), dikembalikan dari dasbor Midtrans atau di loket. Membayar orangnya di loket saja tidak menghapus barisnya, sedangkan refund yang dilaporkan Midtrans lewat BI-SNAP melunasi bagian yang dicakupnya.
admOwedSince=Terutang sejak
admOwed=Terutang
admOf=Dari
admReason=Alasan
admNothingOwed=Tidak ada yang terutang.
admGatewayRefunds=Refund di gateway yang perlu diperiksa
admGatewayRefundsWhat=Midtrans melaporkan pembayaran ini sudah dikembalikan, tetapi pengembalian itu tidak melunasi utang yang tercatat di sini, jadi kursinya masih terjual dan tidak ada yang diubah. Putuskan nasib kursinya: membatalkan kursi yang sudah dibayar mencatat utang baru, padahal refund ini mungkin sudah membayarnya. Refund otomatis yang ditolak Midtrans juga tercantum di sini, beserta langkahnya; utangnya tetap di bawah Dana yang harus dikembalikan sampai uangnya dikembalikan.
admNoGatewayRefunds=Tidak ada.
admGatewayRefundsResolveNote=Setelah Anda memutuskan, tandai baris ini selesai dan ia keluar dari daftar. Pemberitahuan refund berikutnya untuk pembayaran yang sama akan mencantumkannya lagi.
admMarkResolved=Tandai selesai

