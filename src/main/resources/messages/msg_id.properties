chatIntro=Tanyakan dengan kata-kata Anda sendiri, misalnya: "Dua kursi untuk The Last Ferry di Bandung besok malam, di tengah." Asisten mencarikan jadwal tayang dan mengusulkan kursi; Anda memeriksanya di peta kursi dan menahannya sendiri. Asisten tidak pernah memesan atau membayar untuk Anda.
chatPrivacy=Layanan demo: yang Anda ketik di sini dikirim ke {host} untuk menyusun jawaban, dan dapat dicatat di sana. Jangan mengetik nama, nomor telepon, alamat email, atau data pribadi lainnya.
