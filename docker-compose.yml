services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's image expects a single mount at /var/lib/postgresql (not
      # .../data) so it can lay out major-version-specific subdirectories itself
      # (pg_ctlcluster-compatible layout) — mounting straight at .../data is the
      # pre-18 convention and makes the 18 image refuse to start.
      - booking-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  booking-postgres-data:
